<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="../estilos.css">

    <title>Tienda de F1 - Contacto</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark navbar-bandera">
            <div class="container-fluid">
                <a class="navbar-brand position-absolute start-50 translate-middle-x" href="../index.html" style="top: 10px;">
                    <img src="../img/head/logo.png" alt=" logo formula 1" width="100" height="20"
                        class="d-inline-block align-text-middle m-0 rounded" />
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                    aria-label="Barra de Navegacion">
                    <span class="navbar-toggler-icon navbar"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav ms-auto">
                        
                        <li class="nav-item">
                            <a class="nav-link active btn-contacto-verde" aria-current="page" href="../index.html">Inicio</a>
                            <a class="nav-link active btn-contacto-verde" aria-current="page" href="./carrito.html">Carrito</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

		<div class="position-relative">
				
                <button id="themeBtn" class="toggle-btn position-absolute top-0 end-0 me-3 mt-1 btn btn-dark">
                    <span class="sun"> ☀️ </span>
                    <span class="moon"> 🌙 </span>
                </button>
			</div>
        </div>
    </header>

    <div class="container my-5" style="max-width: 600px;">
        <h2 class="text-center mb-4">Contactarnos</h2>

        <form id="form-contacto">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nombre" placeholder="nombre" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico:</label>
                <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="mb-3">
                <label for="mensaje" class="form-label">Tu Consulta:</label>
                <textarea class="form-control" id="mensaje" rows="5"
                    placeholder="Escribí acá tu duda sobre las gorras, remeras o productos..." required></textarea>
            </div>
            <button onclick="recibirContacto()" class="btn btn-danger w-100">Enviar Mensaje</button>

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script src="../app.js"></script>
</body>

</html>
