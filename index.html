<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">

    <!-- Estilo de css-->
    <link rel="stylesheet" href="estilos.css">

    <title>Tienda de F1</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark navbar-bandera">
            <div class="container-fluid">
                <a class="navbar-brand position-absolute start-50 translate-middle-x" href="./index.html" style="top: 10px;">
                    <img
                        src="./img/head/logo.png"
                        alt=" logo formula 1"
                        width="100"
                        height="20"
                        class="d-inline-block align-text-middle m-2 rounded"/>
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNavDropdown"
                    aria-controls="navbarNavDropdown"
                    aria-expanded="false"
                    aria-label="Barra de Navegacion">
                    <span class="navbar-toggler-icon navbar"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link btn-contacto-verde" href="./template/contacto.html">Contacto</a>
                            <a class="nav-link btn-contacto-verde" href="./template/carrito.html">Carrito</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container text-end mt-2">
            <button id="contrast-toggle" class="btn btn-secondary">🌙</button>
        </div>
    </header>
    <div class="contenedor-carrusel">

        <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="2" aria-label="Slide 3"></button>
                <button type="button" data-bs-check-to="3" data-bs-target="#carouselExampleInterval" data-bs-slide-to="3" aria-label="Slide 4"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active" data-bs-interval="10000">
                    <img src="img/card/colapinto-alpine.png" class="d-block w-100" alt="Colapinto Alpine">
                </div>
                <div class="carousel-item">
                    <img src="img/card/verstappen-rb.png" class="d-block w-100" alt="Verstappen Red Bull">
                </div>
                <div class="carousel-item">
                    <img src="img/card/hamilton-leclerc-ferrari.png" class="d-block w-100" alt="Ferrari">
                </div>
                <div class="carousel-item">
                    <img src="img/card/kimi-russell-mercedes.png" class="d-block w-100" alt="Antonelli Mercedes">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>

        <div class="container my-4" style="max-width: 700px;">
            <div class="row g-3"> 
                <div class="col-md-6">
                    <div class="form-floating">
                        <select class="form-select" id="seleccion-categoria">
                            <option value="general">General</option>
                            <option value="gorra">Gorras</option>
                            <option value="remera">Remeras</option>
                            <option value="campera">Camperas</option>
                        </select>
                        <label for="listaCategorias">Seleccioné una categoría:</label>
                    </div>
                </div>

            </div>    
        </div>

        <div class="container my-5">
            <div class="row row-cols-1 row-cols-md-3 g-4">

                <div class="col tarjeta-producto" data-categoria="remera" data-equipo="alpine">
                    <div class="card h-100 shadow-sm"> <img src="img/products/alpine/remera-alpine.png" 
                        class="card-img-top" 
                        alt="Remera Alpine">
                        <div class="card-body text-center">
                            <h5 class="card-title">Remera de Alpine</h5>
                            <p class="card-text text-muted">Versión original</p>
                            <h4 class="text-danger">$45.000</h4>
                            <a href="#" class="btn btn-carrito w-100 mt-2" onclick="agregarProducto(event, 'Remera de Alpine', 45000)">Agrega al carrito</a>
                        </div>
                    </div>
                </div>

                <div class="col tarjeta-producto" data-categoria="campera" data-equipo="ferrari">
                    <div class="card h-100 shadow-sm">
                        <img src="img/products/ferrari/campera-ferrari.png" class="card-img-top" alt="Campera Ferrari">
                        <div class="card-body text-center">
                            <h5 class="card-title">Campera de Scuderia Ferrari</h5>
                            <p class="card-text text-muted">Versión original</p>
                            <h4 class="text-danger">$55.000</h4>
                            <a href="#" class="btn btn-carrito w-100 mt-2" onclick="agregarProducto(event,'Campera de Ferrari', 55000)">Agrega al carrito</a>
                        </div>
                    </div>
                </div>
                
                <div class="col tarjeta-producto" data-categoria="gorra" data-equipo="mercedes">
                    <div class="card h-100 shadow-sm">
                        <img src="img/products/mercedes/gorra-merecedes.png" class="card-img-top" alt="Gorra Mercedes">
                        <div class="card-body text-center">
                            <h5 class="card-title">Gorra de Mercedes </h5>
                            <p class="card-text text-muted">Versión réplica</p>
                            <h4 class="text-danger">$20.000</h4>
                            <a href="#" class="btn btn-carrito w-100 mt-2" onclick="agregarProducto(event,'Gorra de Mercedes', 20000)">Agrega al carrito</a>
                        </div>
                    </div>
                </div>
                
                <div class="col tarjeta-producto" data-categoria="remera" data-equipo="redbull">
                    <div class="card h-100 shadow-sm">
                        <img src="img/products/redbull/remera-rb.png" class="card-img-top" alt="Remera Red Bull">
                        <div class="card-body text-center">
                            <h5 class="card-title">Remera de Red Bull </h5>
                            <p class="card-text text-muted">Versión réplica</p>
                            <h4 class="text-danger">$40.000</h4>
                            <a href="#" class="btn btn-carrito w-100 mt-2" onclick="agregarProducto(event,'Remera de Red Bull', 40000)">Agrega al carrito</a>
                        </div>
                    </div>
                </div>

            </div>
    
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script src="app.js"></script>
    <script src="constanteModeDark.js"></script>
</body>

</html>
