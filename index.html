<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">

    <!-- Estilo de css-->
    <link rel="stylesheet" href="estilos.css">

    <title>Tienda de F1</title>
</head>

<body>
    		<header>
			<nav class="navbar navbar-expand-lg navbar-dark bg-dark navbar-bandera">
				<div class="container-fluid">
					<a class="navbar-brand position-absolute start-50 translate-middle-x" href="./index.html" style="top: 10px;">
						<img
							src="./img/head/logo.png"
							alt=" logo formula 1"
							width="100"
							height="20"
							class="d-inline-block align-text-middle m-2 rounded"
						/>
					</a>
					<button
						class="navbar-toggler"
						type="button"
						data-bs-toggle="collapse"
						data-bs-target="#navbarNavDropdown"
						aria-controls="navbarNavDropdown"
						aria-expanded="false"
						aria-label="Barra de Navegacion"
					>
						<span class="navbar-toggler-icon navbar"></span>
					</button>
					<div class="collapse navbar-collapse" id="navbarNavDropdown">
						<ul class="navbar-nav ms-auto">
							<li class="nav-item">
								<a class="nav-link btn-contacto-verde" href="./template/contacto.html">Contacto</a>
                                <a class="nav-link btn-contacto-verde" href="./template/lista-de-carrito.html">Carrito</a>
							</li>
						</ul>
					</div>
				</div>
			</nav>
			<div class="position-relative">
				<button
					id="contrast-btn"
					class="position-absolute top-0 end-0 me-3 mt-3 btn btn-dark"
				>
					<span class="bi bi-circle-half"> Cambiar Contraste</span>
				</button>
			</div>
		</header>
    <div class="contenedor-carrusel">

        <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="2" aria-label="Slide 3"></button>
                <button type="button" data-bs-check-to="3" data-bs-target="#carouselExampleInterval" data-bs-slide-to="3" aria-label="Slide 4"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active" data-bs-interval="10000">
                    <img src="img/card/colapinto-alpine.png" class="d-block w-100" alt="Colapinto Alpine">
                </div>
                <div class="carousel-item">
                    <img src="img/card/verstappen-rb.png" class="d-block w-100" alt="Verstappen Red Bull">
                </div>
                <div class="carousel-item">
                    <img src="img/card/hamilton-leclerc-ferrari.png" class="d-block w-100" alt="Ferrari">
                </div>
                <div class="carousel-item">
                    <img src="img/card/kimi-russell-mercedes.png" class="d-block w-100" alt="Antonelli Mercedes">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script src="app.js"></script>
</body>

</html>
